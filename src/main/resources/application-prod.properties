# ========================
# application-prod.properties
# ========================
# Perfil de PRODUÇÃO com PostgreSQL

spring.profiles.active=prod

# ========================
# DataSource - PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/construshop
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:construshop_user}
spring.datasource.password=${DB_PASSWORD:secure_password}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================
# Connection Pool
# ========================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ========================
# Logging
# ========================
logging.level.root=INFO
logging.level.com.reis.construshop=INFO

# ========================
# Seed data - DESABILITADO em produção
# ========================
spring.sql.init.mode=never

