# ========================
# application-test.properties
# ========================
# Perfil de TESTES com H2 em memória

spring.profiles.active=test

# ========================
# DataSource - H2 (testes)
# ========================
spring.datasource.url=jdbc:h2:mem:construshop_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================
# JPA / Hibernate
# ========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========================
# H2 Console (desabilitado em testes)
# ========================
spring.h2.console.enabled=false

# ========================
# Seed data
# ========================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ========================
# Logging
# ========================
logging.level.root=WARN
logging.level.com.reis.construshop=DEBUG

